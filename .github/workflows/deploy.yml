name: Deploy to GitHub Pages
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
